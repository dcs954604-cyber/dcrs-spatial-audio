<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCRS Spatial Audio</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: monospace, sans-serif;
            text-align: center;
            padding: 10px;
            margin: 0;
        }
        h1 { color: #38bdf8; font-size: 1.5rem; margin: 10px 0; }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 12px;
            margin: 8px auto;
            max-width: 380px;
            border-radius: 8px;
        }
        button, select {
            background: #38bdf8;
            color: #0b0f19;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 5px;
            margin: 5px;
            cursor: pointer;
        }
        video {
            width: 160px;
            height: 120px;
            border: 2px solid #334155;
            border-radius: 6px;
            transform: scaleX(-1);
            margin-top: 5px;
        }
        input[type=range] { width: 90%; }
    </style>
</head>
<body>
    <h1>DCRS Spatial Audio</h1>
    <div class="card">
        <p style="margin:5px 0;">Brand: DCRS Productions</p>
        <p style="margin:5px 0;">Target: POCO F1 / Android 10</p>
        <button id="startBtn">Start Engine</button>
    </div>

    <div class="card">
        <h3>Camera Tracking</h3>
        <video id="webcam" autoplay playsinline muted></video>
        <p id="status" style="color: #38bdf8;">Status: Ready to start</p>
        <p id="yawDisplay">Head Yaw: 0°</p>
        <button id="calibBtn">Calibrate Center</button>
    </div>

    <div class="card">
        <h3>Spatial Audio Player</h3>
        <audio id="audioElement" loop crossorigin="anonymous">
            <source src="https://actions.google.com/sounds/v1/ambiences/rain_heavy.ogg" type="audio/ogg">
        </audio>
        <button id="playAudioBtn">Play Audio</button>
        <br><br>
        <label>Sensitivity: <span id="sensVal">1.5</span></label><br>
        <input type="range" id="sensRange" min="0.5" max="3.0" step="0.1" value="1.5">
    </div>

<script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

    const startBtn = document.getElementById('startBtn');
    const calibBtn = document.getElementById('calibBtn');
    const playAudioBtn = document.getElementById('playAudioBtn');
    const webcam = document.getElementById('webcam');
    const status = document.getElementById('status');
    const yawDisplay = document.getElementById('yawDisplay');
    const audioElement = document.getElementById('audioElement');
    const sensRange = document.getElementById('sensRange');

    let faceLandmarker;
    let webcamRunning = false;
    let audioCtx, pannerNode, sourceNode;
    let centerYaw = 0;
    let sensitivity = 1.5;

    sensRange.addEventListener('input', (e) => {
        sensitivity = parseFloat(e.target.value);
        document.getElementById('sensVal').textContent = sensitivity;
    });

    startBtn.addEventListener('click', async () => {
        status.textContent = "Loading MediaPipe...";
        const filesetResolver = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
        );
        faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
            baseOptions: {
                modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                delegate: "GPU"
            },
            runningMode: "VIDEO",
            numFaces: 1
        });
        status.textContent = "Model Loaded. Starting Camera...";
        startCamera();
    });

    function startCamera() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 320, height: 240 } })
            .then((stream) => {
                webcam.srcObject = stream;
                webcam.addEventListener('loadeddata', predictWebcam);
                status.textContent = "Tracking Active";
            })
            .catch(err => {
                status.textContent = "Camera Error: " + err.message;
            });
    }

    async function predictWebcam() {
        if (!faceLandmarker) return;
        let startTimeMs = performance.now();
        if (webcam.currentTime !== 0) {
            const results = faceLandmarker.detectForVideo(webcam, startTimeMs);
            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                const landmarks = results.faceLandmarks[0];
                // Approximate yaw calculation using nose (1), left ear (234), right ear (454)
                const leftEar = landmarks[234];
                const rightEar = landmarks[454];
                const nose = landmarks[1];
                
                const rawYaw = (nose.x - (leftEar.x + rightEar.x) / 2) * 100;
                let adjustedYaw = (rawYaw - centerYaw) * sensitivity;
                
                yawDisplay.textContent = `Head Yaw: ${adjustedYaw.toFixed(1)}°`;

                // Update Spatial Audio Panner Position if active
                if (pannerNode) {
                    // Map yaw to 3D X coordinate (-2m to +2m)
                    let pannerX = Math.max(-2, Math.min(2, adjustedYaw / 15));
                    pannerNode.positionX.setValueAtTime(pannerX, audioCtx.currentTime);
                    pannerNode.positionZ.setValueAtTime(-1.0, audioCtx.currentTime);
                }
            }
        }
        window.requestAnimationFrame(predictWebcam);
    }

    calibBtn.addEventListener('click', () => {
        // Recalibrate center offset
        // For simplicity, reset center
        centerYaw = 0;
        status.textContent = "Calibrated Center!";
    });

    playAudioBtn.addEventListener('click', () => {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioCtx.createMediaElementSource(audioElement);
            
            pannerNode = audioCtx.createPanner();
            pannerNode.panningModel = 'HRTF';
            pannerNode.distanceModel = 'inverse';
            pannerNode.refDistance = 1;
            pannerNode.maxDistance = 10000;
            pannerNode.rolloffFactor = 1;
            pannerNode.coneInnerAngle = 360;

            // Listener position fixed at center
            audioCtx.listener.positionX.setValueAtTime(0, audioCtx.listener.currentTime);
            audioCtx.listener.positionY.setValueAtTime(0, audioCtx.listener.currentTime);
            audioCtx.listener.positionZ.setValueAtTime(0, audioCtx.listener.currentTime);

            sourceNode.connect(pannerNode);
            pannerNode.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        if (audioElement.paused) {
            audioElement.play();
            playAudioBtn.textContent = "Pause Audio";
        } else {
            audioElement.pause();
            playAudioBtn.textContent = "Play Audio";
        }
    });
</script>
</body>
</html>
