<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Abhimanyu: Chakravyuha Survival</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffcc00;
            z-index: 10;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 5px 0; font-size: 22px; letter-spacing: 1px; }
        p { margin: 0; font-size: 14px; color: #fff; }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>CHAKRAVYUHA SURVIVAL</h1>
        <p id="wave-text">Wave: 1 | Enemies Defeated: 0</p>
        <p id="status-text" style="color: #ff4444; font-weight: bold;">Status: Stand Your Ground</p>
    </div>
    <div id="controls-hint">Drag to Rotate Camera | Tap Anywhere to Throw Returning Wheel</div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let player, wheel;
        let enemies = [];
        let wave = 1;
        let score = 0;
        let isAlive = true;
        let spawnTimer = 0;

        // Wheel Throw Mechanics
        let isWheelThrown = false;
        let wheelVelocity = new THREE.Vector3();

        // Touch & Mouse Control Variables
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngle = 0;
        let touchStartTime = 0;
        let touchStartPos = { x: 0, y: 0 };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0f08);
            scene.fog = new THREE.FogExp2(0x1a0f08, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffa500, 0.4);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffeedd, 0.8);
            sunLight.position.set(20, 40, 20);
            sunLight.castShadow = true;
            scene.add(sunLight);

            const floorGeo = new THREE.PlaneGeometry(300, 300);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x2b1d0c, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Abhimanyu Character Group
            player = new THREE.Group();
            
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x990000, roughness: 0.5 });
            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.6, 1.5, 6);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.75;
            body.castShadow = true;
            player.add(body);

            const headMat = new THREE.MeshStandardMaterial({ color: 0xdcaca6 });
            const headGeo = new THREE.SphereGeometry(0.3, 8, 8);
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.6;
            player.add(head);

            // Broken Chariot Wheel Weapon
            const wheelGroup = new THREE.Group();
            const rimGeo = new THREE.TorusGeometry(0.8, 0.12, 8, 24);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.8 });
            const rim = new THREE.Mesh(rimGeo, wheelMat);
            rim.rotation.x = Math.PI / 2;
            wheelGroup.add(rim);

            for (let i = 0; i < 4; i++) {
                const spokeGeo = new THREE.BoxGeometry(0.08, 0.08, 1.5);
                const spoke = new THREE.Mesh(spokeGeo, wheelMat);
                spoke.rotation.y = (Math.PI / 2) * i;
                wheelGroup.add(spoke);
            }
            wheelGroup.position.set(0.9, 0.9, 0);
            player.add(wheelGroup);
            wheel = wheelGroup;

            scene.add(player);

            // Clean Pointer Logic to Separate Dragging (Camera) from Tapping (Throwing)
            window.addEventListener('resize', onWindowResize);
            
            document.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
                touchStartTime = Date.now();
                touchStartPos = { x: e.clientX, y: e.clientY };
            });

            document.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                cameraAngle -= deltaX * 0.008;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            document.addEventListener('pointerup', (e) => {
                isDragging = false;
                const moveDistance = Math.hypot(e.clientX - touchStartPos.x, e.clientY - touchStartPos.y);
                const touchDuration = Date.now() - touchStartTime;

                // If it's a quick tap without dragging much, throw the wheel!
                if (touchDuration < 250 && moveDistance < 10) {
                    throwWheel();
                }
            });

            animate();
        }

        function throwWheel() {
            if (!isAlive || isWheelThrown) return;
            isWheelThrown = true;

            scene.attach(wheel);
            wheel.position.copy(player.position).add(new THREE.Vector3(0, 1.2, 0));

            const forwardDir = new THREE.Vector3(
                -Math.sin(cameraAngle),
                0,
                -Math.cos(cameraAngle)
            );
            
            wheelVelocity.copy(forwardDir).multiplyScalar(0.85);
        }

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const distance = 30;
            const x = player.position.x + Math.cos(angle) * distance;
            const z = player.position.z + Math.sin(angle) * distance;

            const enemyGeo = new THREE.ConeGeometry(0.4, 1.4, 4);
            const enemyMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const enemyMesh = new THREE.Mesh(enemyGeo, enemyMat);
            enemyMesh.position.set(x, 0.7, z);
            enemyMesh.castShadow = true;
            scene.add(enemyMesh);

            enemies.push({ mesh: enemyMesh, speed: 0.05 + (wave * 0.004) });
        }

        function updateUI() {
            document.getElementById('wave-text').innerText = `Wave: ${wave} | Enemies Defeated: ${score}`;
            if (score >= wave * 5) {
                wave++;
                document.getElementById('status-text').innerText = `Wave ${wave} Closing In!`;
            }
        }

        function animate() {
            if (!isAlive) return;
            requestAnimationFrame(animate);

            spawnTimer++;
            if (spawnTimer > Math.max(25, 90 - (wave * 10))) {
                spawnEnemy();
                spawnTimer = 0;
            }

            // Wheel Flight & Boomerang Return
            if (isWheelThrown) {
                wheel.position.add(wheelVelocity);
                wheel.rotation.z += 0.45; // Fast spin

                enemies.forEach((enemy, index) => {
                    if (wheel.position.distanceTo(enemy.mesh.position) < 1.8) {
                        scene.remove(enemy.mesh);
                        enemies.splice(index, 1);
                        score++;
                        updateUI();
                    }
                });

                // Homing return to player after distance
                const distToPlayer = wheel.position.distanceTo(player.position);
                if (distToPlayer > 15) {
                    wheelVelocity.negate().multiplyScalar(1.1);
                }

                const toPlayer = new THREE.Vector3().subVectors(player.position, wheel.position);
                if (distToPlayer > 10) {
                    wheelVelocity.lerp(toPlayer.normalize().multiplyScalar(0.9), 0.15);
                }

                // Catch back in hand
                if (distToPlayer < 1.3 && isWheelThrown && wheelVelocity.length() < 10) {
                    isWheelThrown = false;
                    wheelVelocity.set(0,0,0);
                    player.add(wheel);
                    wheel.position.set(0.9, 0.9, 0);
                    wheel.rotation.set(0,0,0);
                }
            }

            // Move enemies towards player
            enemies.forEach((enemy) => {
                enemy.mesh.lookAt(player.position);
                enemy.mesh.translateZ(enemy.speed);

                if (enemy.mesh.position.distanceTo(player.position) < 1.0) {
                    isAlive = false;
                    document.getElementById('status-text').innerText = `FALLEN IN THE CHAKRAVYUHA. Score: ${score}. Tap to Restart.`;
                    document.getElementById('status-text').style.color = '#ff0000';
                    document.addEventListener('click', () => location.reload(), { once: true });
                }
            });

            // GTA V Style Third-Person Camera
            const targetCameraX = player.position.x + Math.sin(cameraAngle) * 6;
            const targetCameraZ = player.position.z + Math.cos(cameraAngle) * 6;
            camera.position.set(targetCameraX, player.position.y + 3, targetCameraZ);
            camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
